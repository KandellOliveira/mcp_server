[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-server-python"
version = "0.1.0"
description = "Servidor MCP em Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.1.0",
]

[project.scripts]
mcp-server-python = "mcp_server.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
